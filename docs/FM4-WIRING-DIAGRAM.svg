<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <style>
    .bg{fill:#101722}.box{fill:#1d2a3a;stroke:#8fb7d8;stroke-width:3}.sub{fill:#152131;stroke:#4f6b83;stroke-width:2}.title{font:700 34px Arial;fill:#f2f7fb}.h{font:700 20px Arial;fill:#e5f1fb}.t{font:16px Arial;fill:#d5e4f2}.s{font:14px Arial;fill:#afc3d7}.pin{font:700 14px Arial;fill:#fff}.note{font:14px Arial;fill:#b5c9da}.spi{stroke:#ffb454;stroke-width:4;fill:none}.i2c{stroke:#5ed6c9;stroke-width:4;fill:none}.gpio{stroke:#a98bff;stroke-width:4;fill:none}.pwr{stroke:#ff6b7a;stroke-width:4;fill:none}.gnd{stroke:#8695a5;stroke-width:4;fill:none}.dot{stroke:#101722;stroke-width:2}
  </style>
  <rect class="bg" width="1600" height="1080"/>
  <text x="60" y="58" class="title">PiCore FM Empowered — verified wiring map</text>
  <text x="60" y="86" class="note">Raspberry Pi 4 • piCorePlayer + Sable / FM Empowered • BCM GPIO numbers and physical header pins shown</text>

  <rect class="box" x="580" y="155" width="450" height="720" rx="24"/>
  <text x="708" y="205" class="h">RASPBERRY PI 4</text>
  <text x="693" y="231" class="s">40-pin GPIO header</text>
  <rect class="sub" x="695" y="260" width="220" height="500" rx="12"/>
  <text x="731" y="292" class="h">USED HEADER PINS</text>
  <g class="pin">
    <text x="720" y="330">Pin 1</text><text x="800" y="330">3V3</text>
    <text x="720" y="360">Pin 3</text><text x="800" y="360">GPIO2 / SDA</text>
    <text x="720" y="390">Pin 5</text><text x="800" y="390">GPIO3 / SCL</text>
    <text x="720" y="420">Pin 7</text><text x="800" y="420">GPIO4 / IR</text>
    <text x="720" y="450">Pin 18</text><text x="800" y="450">GPIO24 / OLED DC</text>
    <text x="720" y="480">Pin 19</text><text x="800" y="480">GPIO10 / MOSI</text>
    <text x="720" y="510">Pin 22</text><text x="800" y="510">GPIO25 / OLED RST</text>
    <text x="720" y="540">Pin 23</text><text x="800" y="540">GPIO11 / SCLK</text>
    <text x="720" y="570">Pin 24</text><text x="800" y="570">GPIO8 / CE0</text>
    <text x="720" y="600">Pin 29</text><text x="800" y="600">GPIO5 / ROT DT</text>
    <text x="720" y="630">Pin 31</text><text x="800" y="630">GPIO6 / ROT SW</text>
    <text x="720" y="660">Pin 33</text><text x="800" y="660">GPIO13 / ROT CLK</text>
    <text x="720" y="690">Pin 40</text><text x="800" y="690">GPIO21 / SHUTDOWN</text>
    <text x="720" y="720">2 / 4</text><text x="800" y="720">5V (OLED if required)</text>
    <text x="720" y="750">6 / 9 / 14</text><text x="800" y="750">GND</text>
  </g>

  <rect class="box" x="70" y="150" width="360" height="260" rx="20"/>
  <text x="160" y="195" class="h">SSD1322 OLED</text>
  <text x="112" y="225" class="t">256 × 64 SPI display</text>
  <text x="112" y="258" class="t">VCC → 5V (Pin 2 or 4)*</text>
  <text x="112" y="286" class="t">GND → GND</text>
  <text x="112" y="314" class="t">DIN → GPIO10 / Pin 19</text>
  <text x="112" y="342" class="t">CLK → GPIO11 / Pin 23</text>
  <text x="112" y="370" class="t">CS → GPIO8 / Pin 24</text>
  <text x="112" y="398" class="t">DC → GPIO24 / Pin 18 • RST → GPIO25 / Pin 22</text>

  <rect class="box" x="70" y="500" width="360" height="290" rx="20"/>
  <text x="132" y="545" class="h">MCP23017 BUTTON / LED BOARD</text>
  <text x="112" y="577" class="t">VDD → 3V3 (Pin 1) • GND → GND</text>
  <text x="112" y="605" class="t">SDA → GPIO2 / Pin 3</text>
  <text x="112" y="633" class="t">SCL → GPIO3 / Pin 5</text>
  <text x="112" y="670" class="t">GPIOA 0–7 → LEDs 1–8</text>
  <text x="112" y="698" class="t">GPIOB0–1 → button matrix columns</text>
  <text x="112" y="726" class="t">GPIOB2–5 → button matrix rows</text>
  <text x="112" y="764" class="s">I²C address: 0x20 • LED ribbon is logically reversed in Sable</text>

  <rect class="box" x="1165" y="135" width="350" height="195" rx="20"/>
  <text x="1260" y="178" class="h">ROTARY ENCODER</text>
  <text x="1207" y="211" class="t">VCC → 3V3 • GND → GND</text>
  <text x="1207" y="241" class="t">CLK → GPIO13 / Pin 33</text>
  <text x="1207" y="270" class="t">DT → GPIO5 / Pin 29</text>
  <text x="1207" y="299" class="t">SW → GPIO6 / Pin 31</text>

  <rect class="box" x="1165" y="420" width="350" height="180" rx="20"/>
  <text x="1258" y="463" class="h">HS0038 IR RECEIVER</text>
  <text x="1207" y="496" class="t">VCC → 3V3 • GND → GND</text>
  <text x="1207" y="526" class="t">OUT → GPIO4 / Pin 7</text>
  <text x="1207" y="561" class="s">Mounted in the former front-panel LED 8 opening</text>

  <rect class="box" x="1165" y="695" width="350" height="145" rx="20"/>
  <text x="1245" y="738" class="h">SHUTDOWN SWITCH</text>
  <text x="1207" y="772" class="t">Momentary switch: GPIO21 / Pin 40 ↔ GND</text>
  <text x="1207" y="804" class="s">Hold to request Sable’s graceful shutdown</text>

  <path class="spi" d="M580 480 H510 V314 H430"/><path class="spi" d="M580 510 H490 V342 H430"/><path class="spi" d="M580 540 H470 V370 H430"/><path class="gpio" d="M580 450 H450 V398 H430"/>
  <path class="i2c" d="M580 360 H500 V605 H430"/><path class="i2c" d="M580 390 H520 V633 H430"/>
  <path class="gpio" d="M1030 660 H1100 V241 H1165"/><path class="gpio" d="M1030 600 H1120 V270 H1165"/><path class="gpio" d="M1030 630 H1140 V299 H1165"/>
  <path class="gpio" d="M1030 420 H1165"/><path class="gpio" d="M1030 690 H1100 V772 H1165"/>
  <path class="pwr" d="M580 330 H480 V258 H430"/><path class="pwr" d="M1030 330 H1100 V211 H1165"/><path class="pwr" d="M1030 330 H1080 V496 H1165"/>
  <path class="gnd" d="M580 750 H470 V286 H430"/><path class="gnd" d="M1030 750 H1100 V211 H1165"/><path class="gnd" d="M1030 750 H1080 V496 H1165"/><path class="gnd" d="M1030 750 H1165"/>

  <g><circle class="dot" fill="#ffb454" cx="580" cy="480" r="7"/><circle class="dot" fill="#5ed6c9" cx="580" cy="360" r="7"/><circle class="dot" fill="#a98bff" cx="1030" cy="420" r="7"/><circle class="dot" fill="#ff6b7a" cx="580" cy="330" r="7"/><circle class="dot" fill="#8695a5" cx="580" cy="750" r="7"/></g>
  <text x="70" y="950" class="h">Power / connection notes</text>
  <text x="70" y="980" class="note">* Check your OLED module’s printed voltage requirement. The MCP23017 and HS0038 receiver must use 3.3 V logic/power.</text>
  <text x="70" y="1008" class="note">USB SMSL DAC plugs into a Pi USB port. The headphone output is the Pi’s built-in 3.5 mm jack. HDMI outputs are intentionally hidden in the Sable menu.</text>
  <text x="70" y="1038" class="note">LED 8 remains electrically connected to the MCP23017 but is pulled back behind the panel to make room for the IR receiver.</text>
  <text x="70" y="1064" class="note">Never connect 5 V to a Raspberry Pi GPIO signal pin. Power the Pi off before changing wiring.</text>
</svg>
